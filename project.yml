name: FingerPiano
options:
  bundleIdPrefix: com.fingerpiano
  deploymentTarget:
    iOS: "16.0"
    watchOS: "11.0"
targets:
  FingerPiano:
    type: application
    platform: iOS
    sources:
      - path: FingerPianoiOS
    dependencies:
      - target: FingerPianoWatch
        embed: true
  FingerPianoWatch:
    type: application
    platform: watchOS
    sources:
      - path: FingerPianoWatch
    dependencies:
      - target: FingerPiano
