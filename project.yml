name: FingerPiano
options:
  bundleIdPrefix: com.fingerpiano
  deploymentTarget:
    iOS: "16.0"
    watchOS: "11.0"
targets:
  FingerPiano:
    type: application
    platform: iOS
    sources:
      - path: FingerPianoiOS
    info:
      path: FingerPianoiOS/Info.plist
      properties:
        CFBundleDisplayName: 五指弹琴
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - target: FingerPianoWatch
        embed: true
  FingerPianoWatch:
    type: application
    platform: watchOS
    sources:
      - path: FingerPianoWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fingerpiano.FingerPiano.watchkitapp
        PRODUCT_NAME: FingerPianoWatch
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: FingerPianoWatch/Info.plist
      properties:
        CFBundleDisplayName: 五指弹琴
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.fingerpiano.FingerPiano
