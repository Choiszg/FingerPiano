name: FingerPiano
options:
  bundleIdPrefix: com.fingerpiano
  deploymentTarget:
    iOS: "16.0"
    watchOS: "11.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.fingerpiano
targets:
  FingerPiano:
    type: application
    platform: iOS
    sources:
      - path: FingerPianoiOS
  FingerPianoWatch:
    type: watch2-app
    platform: watchOS
    sources:
      - path: FingerPianoWatch
    dependencies:
      - target: FingerPiano
